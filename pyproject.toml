[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qqa"
version = "0.9.0"
description = "Quasi-Quantum Annealing: a GPU solver for combinatorial, spin-glass, integer, real, and mixed-variable optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yuma Ichikawa" },
]
keywords = [
    "optimization",
    "combinatorial-optimization",
    "annealing",
    "spin-glass",
    "ising",
    "mixed-integer-optimization",
    "nonlinear-optimization",
    "perceptron",
    "hopfield",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Library users receive the newest compatible wheel. The Streamlit deploy
    # file independently pins the current CPU build for reproducible, bounded
    # cloud images without constraining ordinary PyPI installations.
    "torch>=2.2",
    "numpy>=1.24",
    "networkx>=3.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    # Interactive plotting and the dashboard are explicit extras below.
    # Deployment targets install them through requirements.txt; keeping them
    # out of core makes `pip install qqa` a lightweight pure-solver install.
]

[project.optional-dependencies]
plotly = ["plotly>=5.17", "pandas>=2.0"]
gui = ["streamlit>=1.30", "plotly>=5.17", "pandas>=2.0"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10",
]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]
# Optional CRA-PI-GNN backend (PyTorch Geometric port of the NeurIPS 2024
# CRA4CO reference implementation). Pulled in only on demand because PyG
# brings several heavy transitive dependencies and is irrelevant to users
# of the default ``qqa.anneal`` solver. See ``qqa.pignn`` and the
# "Optional CRA-PI-GNN backend" section in README.md.
pignn = ["torch-geometric>=2.6"]
# Optional fused sparse kernels. Kept out of core and all because Triton
# currently targets Linux CUDA environments only.
triton = ["triton>=3.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Exact MIP/MIQP refinement. PySCIPOpt wheels bundle a compatible SCIP build,
# but the dependency stays optional because QQA itself remains pure PyTorch.
scip = ["pyscipopt>=6.1"]
highs = ["highspy>=1.9"]
cpsat = ["ortools>=9.10"]
service = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27"]
# Official QPLIB parser/evaluator. Kept separate from SCIP because users may
# inspect and validate QPLIB files without running an exact solver.
qplib = ["pyqplib>=0.1.8,<0.2"]
# Full public MIPLIB/QPLIB comparison stack. Neither parser nor SCIP is loaded
# by ``import qqa``; installation and invocation are both explicit opt-ins.
benchmark = ["qqa[scip,qplib]"]
# Needed only by the DISCS CO benchmark suite (data/discs/, scripts/setup_discs_data.sh,
# scripts/convert_discs_to_qqa.py, scripts/bench_discs.py). Optional because most
# qqa users will not download the DISCS instances.
discs = [
    "huggingface_hub>=0.20",
    "gdown>=5.0",
    "python-sat>=0.1.7",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.6",
    "nbval>=0.11",
    "requests>=2.31",
]
all = [
    "qqa[plotly,gui,docs,notebook,dev,pignn,discs,benchmark,highs,cpsat,service]",
]

[project.scripts]
qqa = "qqa.cli:main"

[project.urls]
Homepage = "https://github.com/Yuma-Ichikawa/QQA4CO"
Repository = "https://github.com/Yuma-Ichikawa/QQA4CO"
Documentation = "https://yuma-ichikawa.github.io/QQA4CO/"
Issues = "https://github.com/Yuma-Ichikawa/QQA4CO/issues"
Changelog = "https://github.com/Yuma-Ichikawa/QQA4CO/blob/main/CHANGELOG.md"
Paper = "https://openreview.net/forum?id=9EfBeXaXf0"
"CRA paper" = "https://proceedings.neurips.cc/paper_files/paper/2024/hash/54191f424e9013fc1d7b923f6e45dff4-Abstract-Conference.html"
"CPRA paper" = "https://openreview.net/forum?id=ix33zd5zCw"
"Live Demo" = "https://parallelquasiquantum4co.streamlit.app/"

[tool.hatch.build.targets.wheel]
packages = ["src/qqa"]

# Ship the Streamlit dashboard inside the wheel so ``qqa gui`` works after
# ``pip install qqa[gui]`` (without a repo checkout). At runtime the CLI
# resolves the app via ``importlib.resources.files("qqa")`` and falls back to
# the repo-root ``app/`` directory for editable / source installs.
[tool.hatch.build.targets.wheel.force-include]
"app" = "qqa/_app"

[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmark-results/**",
    "/data/**",
]
include = [
    "/src/qqa",
    "/app",
    "/README.md",
    "/CITATION.cff",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.6",
    "nbval>=0.11",
    "requests>=2.31",
]

# Development and CI use the compact CPU wheel on mainstream x86 hosts.
# This uv-only source does not alter published PyPI metadata; macOS and other
# architectures continue to resolve their platform-native Torch wheel from
# PyPI. GPU validation explicitly replaces this wheel in nightly-cuda.yml.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add tests/ to sys.path so test modules can ``from conftest import ...``
# for the helpers exposed in tests/conftest.py (APP, PAGE_DIR,
# make_problem_config, set_slider).
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:qqa.legacy",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402", "F401"]
"app/*" = ["E402"]
