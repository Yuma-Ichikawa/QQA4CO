name: Import verified main bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/transport/qqa-main.bundle"

permissions:
  contents: write

jobs:
  import-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and fast-forward the imported history
        shell: bash
        run: |
          set -euo pipefail
          bundle=.github/transport/qqa-main.bundle
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/remotes/import/main
          imported=$(git rev-parse refs/remotes/import/main)
          test "$imported" = "5bdb57fc556660f6fcb9eec43d2788d9733107a0"
          imported_tree=$(git rev-parse "$imported^{tree}")
          export GIT_AUTHOR_NAME="Yuma Ichikawa"
          export GIT_AUTHOR_EMAIL="58498114+Yuma-Ichikawa@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merged=$(printf '%s
' 'Merge verified QQA4CO release history' | git commit-tree "$imported_tree" -p "$GITHUB_SHA" -p "$imported")
          git push origin "$merged:refs/heads/main"
