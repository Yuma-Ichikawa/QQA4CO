name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      # ``setup-uv`` switched to immutable releases at v8.0.0 and stopped
      # publishing the moving ``@v8`` major tag, so pin to a specific
      # immutable release. See
      # https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: py-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package with CI extras (CPU torch)
        run: uv sync --extra plotly --extra gui --extra docs --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests scripts app

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts app

      - name: Type-check all source modules
        run: uv run mypy --ignore-missing-imports --check-untyped-defs src

      - name: Run tests with coverage
        run: uv run pytest -q --cov=src/qqa --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: MkDocs strict build
        run: uv run mkdocs build --clean --strict

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.11'
        run: uv build

      - name: Small performance regression gate
        if: matrix.python-version == '3.11'
        run: uv run python scripts/check_performance.py
