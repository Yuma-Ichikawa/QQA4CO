name: Weekly representative benchmark

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.12
      - name: Install benchmark environment
        run: uv sync --extra dev --extra benchmark
      - name: Run graph, mixed, black-box, and multi-objective representatives
        run: >-
          uv run pytest -q tests/test_semantics.py tests/test_mixed.py
          tests/test_portfolio_extensions.py tests/test_advanced_optimization.py
          --junitxml=weekly-benchmark.xml
      - name: Run paired public MIPLIB and QPLIB representatives
        run: |
          uv run qqa benchmark fetch miplib --instance air05 --output weekly-public/miplib
          uv run qqa benchmark fetch qplib --instance QPLIB_0031 --output weekly-public/qplib
          uv run qqa benchmark compare weekly-public/miplib/air05.mps.gz \
            --format miplib --solvers scip-aggressive sg-cqqa --seeds 0 1 \
            --time-limit 10 --continue-on-error --quiet \
            --output weekly-public/miplib-result.json
          uv run qqa benchmark compare weekly-public/qplib/QPLIB_0031.qplib \
            --format qplib --solvers scip-aggressive sg-cqqa --seeds 0 1 \
            --time-limit 15 --threads 1 --maximum-problem-variables none \
            --maximum-integer-variables none --min-qqa-time 1 \
            --minimum-runtime-startup-time 1 --min-call-time 0.05 \
            --maximum-call-time 12 --maximum-call-time-fraction 0.8 \
            --maximum-overhead-fraction 0.5 --max-calls 1 \
            --sol-size 32 --epochs 100 --fast-candidates 0 \
            --continue-on-error --quiet \
            --output weekly-public/qplib-result.json
      - name: Verify benchmark completion and an actual QQA intervention
        run: |
          jq -e '(.failures | length) == 0' weekly-public/miplib-result.json
          jq -e '(.failures | length) == 0 and ([.results[] | select(.solver == "sg-cqqa") | (.qqa.qqa_calls // 0)] | any(. > 0))' weekly-public/qplib-result.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: weekly-benchmark
          path: |
            weekly-benchmark.xml
            weekly-public/*-result.json
