name: Nightly CUDA

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-correctness:
    if: ${{ vars.ENABLE_CUDA_CI == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install CUDA test environment
        run: |
          uv sync --extra dev --extra triton
          uv pip install --reinstall "torch==2.13.0+cu130" \
            --index-url https://download.pytorch.org/whl/cu130
      - name: Verify CUDA is available
        run: uv run --no-sync python -c "import torch; assert torch.cuda.is_available()"
      - name: CUDA semantic, compile, and precision tests
        run: >-
          uv run --no-sync pytest -q tests/test_cuda_runtime.py tests/test_semantics.py
          tests/test_smoke.py tests/test_advanced_optimization.py
      - name: Sparse performance gate
        run: uv run --no-sync python scripts/check_performance.py
