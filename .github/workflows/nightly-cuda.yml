name: Nightly CUDA

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-correctness:
    if: ${{ vars.ENABLE_CUDA_CI == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install CUDA test environment
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu128
        run: uv sync --extra dev --extra triton
      - name: Verify CUDA is available
        run: uv run python -c "import torch; assert torch.cuda.is_available()"
      - name: CUDA semantic, compile, and precision tests
        run: >-
          uv run pytest -q tests/test_cuda_runtime.py tests/test_semantics.py
          tests/test_smoke.py tests/test_advanced_optimization.py
      - name: Sparse performance gate
        run: uv run python scripts/check_performance.py
