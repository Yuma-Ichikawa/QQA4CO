name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's changed

  $CHANGES

  ## Install

  ```bash
  pip install qqa==$RESOLVED_VERSION
  pip install "qqa[gui]==$RESOLVED_VERSION"
  ```

  **Full changelog**: https://github.com/Yuma-Ichikawa/QQA4CO/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "Features"
    labels:
      - "enhancement"
      - "feature"
  - title: "Bug fixes"
    labels:
      - "bug"
      - "fix"
  - title: "Performance"
    labels:
      - "performance"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "Build & CI"
    labels:
      - "ci"
      - "build"
      - "dependencies"
  - title: "Refactoring"
    labels:
      - "refactor"
      - "chore"

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "feature"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
      - "chore"
      - "docs"
  default: patch

autolabeler:
  - label: "feature"
    title:
      - '/^feat(\(.*\))?:/i'
  - label: "bug"
    title:
      - '/^fix(\(.*\))?:/i'
  - label: "documentation"
    title:
      - '/^docs(\(.*\))?:/i'
  - label: "performance"
    title:
      - '/^perf(\(.*\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\(.*\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\(.*\))?:/i'
      - '/^style(\(.*\))?:/i'
  - label: "ci"
    title:
      - '/^ci(\(.*\))?:/i'
  - label: "build"
    title:
      - '/^build(\(.*\))?:/i'
  - label: "dependencies"
    title:
      - '/^deps(\(.*\))?:/i'

exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
  - "wontfix"
