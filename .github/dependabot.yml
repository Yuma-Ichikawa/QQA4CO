version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5
    # Only ever propose updates to direct dependencies. Transitive deps come
    # along through `uv sync` automatically and Dependabot otherwise floods
    # the PR queue with noise.
    allow:
      - dependency-type: "direct"
